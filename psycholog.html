    <style>
        :root {
            --bg-body: #F8FAFC;        
            --bg-surface: rgba(255, 255, 255, 0.85);
            --primary: #0F766E;        
            --primary-dark: #0D5E57;
            --primary-light: #CCFBF1;
            --accent: #6366F1;        
            --accent-glow: rgba(99, 102, 241, 0.3);
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --radius: 16px;
            --trans-default: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; font-size: 16px; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1; opacity: 0.6; pointer-events: none; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
        .glass { background: var(--bg-surface); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }

        header { position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); padding: 12px 0; }
        .nav-wrapper { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .brand-bar { display: flex; justify-content: center; align-items: center; width: 100%; position: relative; }
        .logo { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 1.6rem; color: var(--text-main); text-decoration: none; cursor: pointer; letter-spacing: -0.02em; }
        .logo img { height: 50px; width: auto; border-radius: 8px; }
        .nav-link-back { text-decoration: none; color: var(--primary); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; position: absolute; left: 0; top: 50%; transform: translateY(-50%); }

        .mobile-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
        .mobile-toggle span { display: block; width: 24px; height: 2px; background: var(--text-main); margin: 5px 0; transition: 0.3s; }
        .mobile-menu { position: fixed; top: 80px; left: 0; width: 100%; background: white; padding: 24px; border-bottom: 1px solid var(--border); transform: translateY(-150%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .mobile-menu.active { transform: translateY(0); }
        .mobile-link { display: block; padding: 14px 0; font-size: 1.1rem; font-weight: 500; color: var(--text-main); text-decoration: none; border-bottom: 1px solid var(--bg-body); }

        @media (max-width: 900px) {
            .nav-wrapper { flex-direction: row; height: 60px; justify-content: center; padding: 0; }
            .nav-link-back { display: none; }
            .mobile-toggle { display: block; }
            .logo { font-size: 1.1rem; }
            .logo img { height: 36px; }
        }

        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .header-contact { display: flex; gap: 20px; margin-right: 20px; font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
        .header-contact a { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--text-main); transition: 0.2s; }
        .header-contact a:hover { color: var(--primary); }
        .nav-item { padding: 8px 18px; border-radius: 99px; font-size: 0.95rem; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: var(--trans-default); cursor: pointer; }
        .nav-item:hover, .nav-item.active { color: var(--primary); background: var(--primary-light); }
        .nav-cta { background: var(--primary); color: white !important; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25); margin-left: 8px; }
        .nav-cta:hover { background: var(--primary-dark); transform: translateY(-1px); }

        .profile-header {
            display: grid; grid-template-columns: 350px 1fr; gap: 60px;
            margin-top: 80px; margin-bottom: 80px; align-items: start;
        }
        
        .profile-img-container {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .profile-img {
            width: 100%; height: auto; display: block;
            filter: grayscale(100%);
            transition: filter 0.6s ease, transform 0.6s ease;
        }
        .profile-img-container:hover .profile-img {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        .role-badge {
            display: inline-block; background: #E0F2FE; color: #0284C7;
            padding: 8px 16px; border-radius: 99px; font-size: 0.9rem; font-weight: 700;
            margin-bottom: 20px; letter-spacing: 0.05em; text-transform: uppercase;
        }

        .profile-name { font-size: 3rem; line-height: 1.1; margin-bottom: 16px; color: var(--text-main); }
        .profile-titles { font-size: 1.2rem; color: var(--primary); font-weight: 500; margin-bottom: 24px; display: block; }
        
        .bio-text { font-size: 1.05rem; color: var(--text-muted); line-height: 1.8; margin-bottom: 32px; text-align: justify; }

        .tags-container { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 40px; }
        .tag {
            background: white; border: 1px solid var(--border); padding: 8px 16px;
            border-radius: 8px; font-size: 0.9rem; font-weight: 500; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
        }
        .tag span { color: var(--primary); }

        .content-block {
            background: white; padding: 40px; border-radius: 24px; border: 1px solid var(--border);
            margin-bottom: 32px; transition: var(--trans-default);
        }
        .content-block:hover { border-color: var(--primary-light); box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        
        .content-block h2 { font-size: 1.8rem; margin-bottom: 24px; color: var(--text-main); border-bottom: 2px solid var(--bg-body); padding-bottom: 12px; display: inline-block; }
        
        .services-list {
            display: grid; grid-template-columns: 1fr; gap: 16px; padding: 0; list-style: none;
        }
        @media (min-width: 768px) { .services-list { grid-template-columns: 1fr 1fr; } }

        .services-list li {
            margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; color: var(--text-muted); font-size: 1.05rem; line-height: 1.4;
        }
        .services-list li::before {
            content: "•"; color: var(--accent); font-weight: bold; font-size: 1.5rem; line-height: 1;
        }

        details {
            margin-bottom: 12px; border: 1px solid var(--border); border-radius: 12px;
            background: white; overflow: hidden; transition: all 0.3s ease;
        }
        details:hover { border-color: var(--primary-light); }
        details[open] { border-color: var(--primary); }
        summary {
            padding: 16px 20px; cursor: pointer; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center; list-style: none;
            color: var(--text-main);
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '+'; font-size: 1.2rem; color: var(--primary); transition: transform 0.2s; }
        details[open] summary::after { transform: rotate(45deg); }
        details[open] summary { background: #F8FAFC; border-bottom: 1px solid var(--border); }
        .details-content { padding: 20px; color: var(--text-muted); background: white; font-size: 0.95rem; line-height: 1.6; }

        @media (max-width: 900px) {
            .profile-header { grid-template-columns: 1fr; gap: 32px; text-align: center; }
            .profile-img-container { max-width: 400px; margin: 0 auto; }
            .tags-container { justify-content: center; }
            .profile-name { font-size: 2.2rem; }
            .bio-text { text-align: left; }
        }

        footer { background: white; border-top: 1px solid var(--border); padding: 60px 0 20px; margin-top: 80px; text-align: center; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 40px; text-align: left; }
    </style>
</head>

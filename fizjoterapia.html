        .mobile-menu{position:fixed;top:80px;left:0;width:100%;background:white;padding:24px;border-bottom:1px solid var(--border);transform:translateY(-150%);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);z-index:999;box-shadow:0 10px 30px rgba(0,0,0,0.05);}

        .mobile-link{display:block;padding:14px 0;font-size:1.1rem;font-weight:500;color:var(--text-main);text-decoration:none;border-bottom:1px solid var(--bg-body);}

        .mobile-bottom-nav {

        .tag span{color:#F59E0B;}

        /* Content Blocks */
        .content-block{background:white;padding:40px;border-radius:24px;border:1px solid var(--border);margin-bottom:32px;transition:var(--trans-default);}

        .content-block h2{font-size:1.8rem;margin-bottom:24px;color:var(--text-main);border-bottom:2px solid var(--bg-body);padding-bottom:12px;display:inline-block;font-family:'Lexend',sans-serif;}

        @media(min-width:600px){.services-list{grid-template-columns:1fr 1fr;}}
        .services-list li{margin-bottom:8px;display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:1.05rem;}
        .services-list li::before{content:"🤸";color:var(--primary);font-weight:bold;font-size:1.2rem;}

        /* Gallery */
        .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:24px;}
        .gallery-item{position:relative;border-radius:20px;overflow:hidden;height:250px;border:1px solid var(--border);cursor:pointer;}

        .gallery-item:hover .gallery-overlay{transform:translateY(0);}

        footer{background:white;border-top:1px solid var(--border);padding:60px 0 20px;margin-top:80px;text-align:center;}
        .footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:40px;text-align:left;}
